<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homerun</title>
    <link rel="stylesheet" href="../Css/player.css">
</head>
<body>
    <main class="player-focus-view">
    <a href="index.html" class="back-button">← Back to Store</a>

    <div class="player-main-content">
        <section class="art-focal-point">
            <div class="glow-container">
                <img src="../Assets/img/homerun.jpeg" alt="Album Art" class="main-art">
            </div>
            <div class="track-info-large">
                <h1>Adán y Eva <span class="heart-icon">♡</span></h1>
                <h2>Paulo Londra</h2>
                <p>Homerun</p>
            </div>
        </section>

        <aside class="up-next-panel">
            <h3>Up Next</h3>
            <div class="queue-list">
                <div class="queue-item">
                    <img src="Assets/img/homerun.jpeg" alt="thumb">
                    <div class="item-text">
                        <p>Tal Vez</p>
                        <small>Paulo Londra</small>
                    </div>
                    <span class="duration">4:23</span>
                </div>
                <div class="queue-item">
                    <img src="Assets/img/back-to-the-game.jpeg" alt="thumb">
                    <div class="item-text">
                        <p>Plan A</p>
                        <small>Paulo Londra</small>
                    </div>
                    <span class="duration">3:58</span>
                </div>
            </div>
        </aside>
    </div>

    <footer class="master-controls">
        <div class="mini-info">
            <img src="Assets/img/homerun.jpeg" alt="mini">
            <div>
                <p>Adán y Eva</p>
                <small>Paulo Londra</small>
            </div>
        </div>

        <div class="playback-engine">
            <div class="buttons">
                <button class="icon-btn">🔀</button>
                <button class="icon-btn">⏮</button>
                <button class="play-main">⏸</button>
                <button class="icon-btn">⏭</button>
                <button class="icon-btn">🔁</button>
            </div>
            <div class="scrubber">
                <span>1:21</span>
                <div class="progress-bar-container">
                    <div class="progress-fill"></div>
                </div>
                <span>4:16</span>
            </div>
        </div>

        <div class="extra-controls">
            <span>🔊</span>
            <div class="volume-bar">
                <div class="volume-fill"></div>
            </div>
            <span>⛶</span>
        </div>
    </footer>
</main>
</body>
</html>
